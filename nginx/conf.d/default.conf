    # Backend static files
    location /static/ {
        alias /static/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Backend media files
    location /media/ {
        alias /media/;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Admin panel
    location /admin/ {
        proxy_pass http://admin_panel/;
        proxy_set_header Host $host;
